name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Opens and maintains a release PR. Merging it tags the release.
  release-please:
    name: » Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: → Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only runs on the push that release-please tagged.
  publish:
    name: » Publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: → Checkout
        uses: actions/checkout@v7

      - name: → Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: → Package the extension
        run: make vscode-package

      - name: → Package the Chrome themes
        run: make chrome-package

      - name: → Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: make vscode-publish-vsce

      - name: → Publish to Open VSX
        if: env.OVSX_PAT != ''
        continue-on-error: true
        run: make vscode-publish-ovsx

      - name: → Note any skipped publish
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "! VSCE_PAT is not set, skipped the VS Code Marketplace"
          fi
          if [ -z "$OVSX_PAT" ]; then
            echo "! OVSX_PAT is not set, skipped Open VSX"
          fi

      - name: → Attach artifacts to the release
        run: |
          gh release upload "$TAG" \
            extras/vscode/*.vsix \
            silkcircuit-chrome-*.zip \
            --clobber
