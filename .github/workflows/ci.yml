name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: » Lint
    runs-on: ubuntu-latest
    steps:
      - name: → Checkout
        uses: actions/checkout@v7

      - name: → Install the pinned toolchain
        uses: jdx/mise-action@v4

      - name: → selene and ruff
        run: make lint

      - name: → stylua, ruff format, and prettier
        run: make fmt-check

  test:
    name: » Test (${{ matrix.neovim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v0.10.4 is the supported floor, stable is what most people run,
        # nightly is the early warning.
        neovim: [v0.10.4, stable, nightly]
    steps:
      - name: → Checkout
        uses: actions/checkout@v7

      - name: → Install Neovim ${{ matrix.neovim }}
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: → Show version
        run: nvim --version

      - name: → Run the suite
        run: make test

  docs:
    name: » Docs
    runs-on: ubuntu-latest
    steps:
      - name: → Checkout
        uses: actions/checkout@v7

      - name: → Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: → Install
        run: npm ci
        working-directory: docs

      - name: → Build
        run: npm run docs:build
        working-directory: docs

      - name: → Check the base path
        run: |
          # The site deploys to hyperb1iss.github.io/silkcircuit. A stale
          # base leaves every asset URL pointing at a 404.
          if grep -rq "silkcircuit-nvim" docs/.vitepress/dist; then
            echo "! Built site references silkcircuit-nvim"
            echo "! Fix 'base' in docs/.vitepress/config"
            grep -rl "silkcircuit-nvim" docs/.vitepress/dist | head -20
            exit 1
          fi
          echo "√ Base path is correct"

  links:
    name: » Links
    runs-on: ubuntu-latest
    steps:
      - name: → Checkout
        uses: actions/checkout@v7

      - name: → Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-verbose-mode: "yes"
          config-file: ".github/markdown-link-check.json"

  success:
    name: √ All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, test, docs, links]
    steps:
      - name: → Success
        run: echo "√ Ready to merge"
