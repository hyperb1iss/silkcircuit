# Hooks run the same tool versions as CI by going through mise, so a hook can
# never format a file differently from `make fmt`. Versions live in mise.toml.
# Install with `make setup`.

# docs/node_modules is currently committed to the repo. Until it is untracked,
# every hook here would happily rewrite 1800 vendored files.
exclude: "(^|/)node_modules/"

repos:
  - repo: local
    hooks:
      - id: stylua
        name: StyLua
        entry: mise x -- stylua
        language: system
        types: [lua]
        args: ["--verify"]

      - id: selene
        name: Selene
        entry: mise x -- selene
        language: system
        types: [lua]
        pass_filenames: false
        args: ["lua/", "tests/"]

      - id: ruff-check
        name: Ruff
        entry: mise x -- ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: Ruff Format
        entry: mise x -- ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: prettier
        name: Prettier
        entry: mise x -- prettier --write --ignore-unknown
        language: system
        types_or: [json, yaml, markdown]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
