# SilkCircuit Dawn for Atuin
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

# Install to ~/.config/atuin/themes/silkcircuit-dawn.toml, then select it with
# `name = "silkcircuit-dawn"` under [theme] in ~/.config/atuin/config.toml.

[theme]
name = "silkcircuit-dawn"

[colors]
# General text
Base = "#2b2540"
# De-emphasised text
Muted = "#686177"
# Emphasised entries
Important = "#7e2bd5"
# Section headings
Title = "#006e72"
# Help text and hints
Guidance = "#546189"
# Metadata shown beside a result
Annotation = "#b42a74"

# Log levels
AlertInfo = "#1d6e46"
AlertWarn = "#796100"
AlertError = "#c1272d"

# Command syntax highlighting, matching the editor theme's roles
SyntaxCommand = "#1d6e46"
SyntaxFlag = "#006e72"
SyntaxString = "#9e4087"
SyntaxVariable = "#7e2bd5"
SyntaxOperator = "#5a4d6e"
SyntaxComment = "#7353a9"
