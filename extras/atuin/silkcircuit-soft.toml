# SilkCircuit Soft for Atuin
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

# Install to ~/.config/atuin/themes/silkcircuit-soft.toml, then select it with
# `name = "silkcircuit-soft"` under [theme] in ~/.config/atuin/config.toml.

[theme]
name = "silkcircuit-soft"

[colors]
# General text
Base = "#f8f8f2"
# De-emphasised text
Muted = "#637777"
# Emphasised entries
Important = "#e892ff"
# Section headings
Title = "#99ffee"
# Help text and hints
Guidance = "#6272a4"
# Metadata shown beside a result
Annotation = "#ff99dd"

# Log levels
AlertInfo = "#66ff99"
AlertWarn = "#ffe699"
AlertError = "#ff6677"

# Command syntax highlighting, matching the editor theme's roles
SyntaxCommand = "#66ff99"
SyntaxFlag = "#99ffee"
SyntaxString = "#ffc2ff"
SyntaxVariable = "#e892ff"
SyntaxOperator = "#e9d5ff"
SyntaxComment = "#b199ff"
