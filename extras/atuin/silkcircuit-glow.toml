# SilkCircuit Glow for Atuin
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

# Install to ~/.config/atuin/themes/silkcircuit-glow.toml, then select it with
# `name = "silkcircuit-glow"` under [theme] in ~/.config/atuin/config.toml.

[theme]
name = "silkcircuit-glow"

[colors]
# General text
Base = "#ffffff"
# De-emphasised text
Muted = "#818181"
# Emphasised entries
Important = "#d633ff"
# Section headings
Title = "#00ffff"
# Help text and hints
Guidance = "#666666"
# Metadata shown beside a result
Annotation = "#ff66ff"

# Log levels
AlertInfo = "#00ff00"
AlertWarn = "#ffff00"
AlertError = "#ff2244"

# Command syntax highlighting, matching the editor theme's roles
SyntaxCommand = "#00ff00"
SyntaxFlag = "#00ffff"
SyntaxString = "#ff99ff"
SyntaxVariable = "#d633ff"
SyntaxOperator = "#cc66ff"
SyntaxComment = "#cc66ff"
