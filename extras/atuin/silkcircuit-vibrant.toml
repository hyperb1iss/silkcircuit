# SilkCircuit Vibrant for Atuin
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

# Install to ~/.config/atuin/themes/silkcircuit-vibrant.toml, then select it with
# `name = "silkcircuit-vibrant"` under [theme] in ~/.config/atuin/config.toml.

[theme]
name = "silkcircuit-vibrant"

[colors]
# General text
Base = "#f8f8f2"
# De-emphasised text
Muted = "#637777"
# Emphasised entries
Important = "#ff00ff"
# Section headings
Title = "#00ffcc"
# Help text and hints
Guidance = "#6272a4"
# Metadata shown beside a result
Annotation = "#f78c6c"

# Log levels
AlertInfo = "#00ff66"
AlertWarn = "#ffcc00"
AlertError = "#ff3366"

# Command syntax highlighting, matching the editor theme's roles
SyntaxCommand = "#00ff66"
SyntaxFlag = "#00ffcc"
SyntaxString = "#ff99ff"
SyntaxVariable = "#ff00ff"
SyntaxOperator = "#e9d5ff"
SyntaxComment = "#b366ff"
