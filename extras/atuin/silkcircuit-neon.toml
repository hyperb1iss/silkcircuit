# SilkCircuit Neon for Atuin
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

# Install to ~/.config/atuin/themes/silkcircuit-neon.toml, then select it with
# `name = "silkcircuit-neon"` under [theme] in ~/.config/atuin/config.toml.

[theme]
name = "silkcircuit-neon"

[colors]
# General text
Base = "#f8f8f2"
# De-emphasised text
Muted = "#637777"
# Emphasised entries
Important = "#e135ff"
# Section headings
Title = "#80ffea"
# Help text and hints
Guidance = "#6272a4"
# Metadata shown beside a result
Annotation = "#ff6ac1"

# Log levels
AlertInfo = "#50fa7b"
AlertWarn = "#f1fa8c"
AlertError = "#ff6363"

# Command syntax highlighting, matching the editor theme's roles
SyntaxCommand = "#50fa7b"
SyntaxFlag = "#80ffea"
SyntaxString = "#ff99ff"
SyntaxVariable = "#e135ff"
SyntaxOperator = "#e9d5ff"
SyntaxComment = "#9580ff"
