# SilkCircuit Vibrant for Starship
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

format = """
[](bg:#0f0c1a fg:#b366ff)\
$os\
$username\
$hostname\
[ ](bold bg:#b366ff)\
[](bg:#ff00ff fg:#b366ff)\
$directory\
[](bg:#ff66ff fg:#ff00ff)\
$git_branch\
$git_status\
[](bg:#ff00cc fg:#ff66ff)\
$nodejs\
$python\
$rust\
$golang\
$java\
$kotlin\
$gradle\
$c\
$lua\
$kubernetes\
[](bg:#00ffcc fg:#ff00cc)\
[](bg:#0f0c1a fg:#00ffcc)\
$character\
"""

# Disable the blank line at the start of the prompt
add_newline = false
command_timeout = 1000

[character]
success_symbol = "[➤](bold fg:#00ffcc) "
error_symbol = "[➤](bold fg:#ff3366) "

# OS module
[os]
format = '[ $symbol]($style)'
style = "bold fg:#0f0c1a bg:#b366ff"
disabled = false

[os.symbols]
Alpine = ""
Amazon = ""
Android = ""
Arch = ""
CachyOS = ""
CentOS = ""
Debian = ""
DragonFly = "🐉"
Emscripten = "🔗"
EndeavourOS = ""
Fedora = ""
FreeBSD = ""
Garuda = ""
Gentoo = ""
HardenedBSD = "聯"
Illumos = "🐦"
Linux = ""
Macos = ""
Manjaro = ""
Mariner = ""
MidnightBSD = "🌘"
Mint = ""
NetBSD = ""
NixOS = ""
OpenBSD = ""
OpenCloudOS = "☁️"
openEuler = ""
openSUSE = ""
OracleLinux = "⊂⊃"
Pop = ""
Raspbian = ""
Redhat = ""
RedHatEnterprise = ""
Redox = "🧪"
Solus = ""
SUSE = ""
Ubuntu = ""
Unknown = ""
Windows = ""

# Username module
[username]
style_user = "bold fg:#0f0c1a bg:#b366ff"
style_root = "bold fg:#ff3366 bg:#b366ff"
format = '[ $user]($style)'
disabled = false
show_always = true

# Hostname configuration for SSH awareness
[hostname]
style = "bold fg:#0f0c1a bg:#b366ff"
ssh_only = true
format = '[@$hostname]($style)'
trim_at = "."
disabled = false

# Directory module
[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold fg:#0f0c1a bg:#ff00ff"
format = "[ $path ]($style)"

# Git branch module
[git_branch]
symbol = " "
style = "bold fg:#0f0c1a bg:#ff66ff"
format = "[ $symbol$branch ]($style)"

# Git status module
# ignore_submodules: scanning submodules made this module regularly blow
# past command_timeout and drop out of the prompt entirely
[git_status]
ignore_submodules = true
style = "bold fg:#0f0c1a bg:#ff66ff"
format = "[$all_status]($style)"

# Node.js module
[nodejs]
symbol = " "
style = "bold fg:#0f0c1a bg:#ff00cc"
format = "[ $symbol($version) ]($style)"
disabled = false

# Python module
[python]
symbol = " "
style = "bold fg:#0f0c1a bg:#ff00cc"
format = '([ $symbol(${virtualenv}) ]($style))'
detect_extensions = ["py"]
detect_files = [
  "requirements.txt",
  "pyproject.toml",
  "Pipfile",
  "tox.ini",
  "setup.py",
]
disabled = false

# Rust module
[rust]
symbol = "󱘗 "
style = "bold fg:#0f0c1a bg:#ff00cc"
format = "[ $symbol($version) ]($style)"
disabled = false

# Go module
[golang]
symbol = "󰟓 "
style = "bold fg:#0f0c1a bg:#ff00cc"
format = "[ $symbol($version) ]($style)"
disabled = false

# Java module
[java]
symbol = "󰬷 "
style = "bold fg:#0f0c1a bg:#ff00cc"
format = "[ $symbol($version) ]($style)"
disabled = false

# Kotlin module
[kotlin]
symbol = "󱈙 "
style = "bold fg:#0f0c1a bg:#ff00cc"
format = "[ $symbol($version) ]($style)"
disabled = false

# Gradle module
[gradle]
symbol = "󱎐 "
style = "bold fg:#0f0c1a bg:#ff00cc"
format = "[ $symbol($version) ]($style)"
disabled = false

# C module
[c]
symbol = "󰙱 "
style = "bold fg:#0f0c1a bg:#ff00cc"
format = "[ $symbol($version) ]($style)"
disabled = false

# Lua module
[lua]
symbol = "󰢱 "
style = "bold fg:#0f0c1a bg:#ff00cc"
format = "[ $symbol($version) ]($style)"
disabled = false

# Kubernetes context — shouts when on prod
[kubernetes]
symbol = "󱃾 "
format = "[ $symbol$context ]($style)"
style = "bold fg:#0f0c1a bg:#ff00cc"
disabled = false
contexts = [
  { context_pattern = ".*[Pp][Rr][Oo][Dd].*", context_alias = "PROD", style = "bold fg:#0f0c1a bg:#ffcc00", symbol = " " },
  # EKS contexts — strip region (e.g., eks-us-west-2-int → eks-int)
  { context_pattern = "eks-[a-z]+-[a-z]+-\\d+-(?P<env>.*)", context_alias = "eks-$env", style = "bold fg:#0f0c1a bg:#ff00cc" },
  # Fallback
  { context_pattern = ".*", style = "bold fg:#0f0c1a bg:#ff00cc" }
]

# Time
[time]
disabled = true
format = '󱑍 [\[ $time \]]($style) '
time_format = "%T"

# Command duration
[cmd_duration]
min_time = 500
format = "took [$duration]($style) "
style = "bold fg:#ff3366"

# Battery
[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "
disabled = false

[[battery.display]]
threshold = 10
style = "bold red"

# Package version
[package]
symbol = "󰏗 "
style = "bold fg:#ff3366"
disabled = false

# Shell indicator
[shell]
fish_indicator = "󰈺 "
powershell_indicator = "󰨊 "
bash_indicator = "󱆃 "
zsh_indicator = "󱐋 "
unknown_indicator = "󰀣 "
style = "cyan bold"
disabled = true
