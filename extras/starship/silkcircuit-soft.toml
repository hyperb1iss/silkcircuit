# SilkCircuit Soft for Starship
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

format = """
[](bg:#1a1626 fg:#302946)\
$os\
$username\
$hostname\
[ ](bold bg:#302946)\
[](bg:#514675 fg:#302946)\
$directory\
[](bg:#6c5e9d fg:#514675)\
$git_branch\
$git_status\
[](bg:#9480d5 fg:#6c5e9d)\
$python\
$kubernetes\
[](bg:#ff99dd fg:#9480d5)\
[](bg:#1a1626 fg:#ff99dd)\
$character\
"""

# Disable the blank line at the start of the prompt
add_newline = false
command_timeout = 1000

[character]
success_symbol = "[➤](bold fg:#ff99dd) "
error_symbol = "[➤](bold fg:#ff6677) "

# OS module
[os]
format = '[ $symbol]($style)'
style = "bold fg:#ffc2ff bg:#302946"
disabled = false

[os.symbols]
Alpine = ""
Amazon = ""
Android = ""
Arch = ""
CachyOS = ""
CentOS = ""
Debian = ""
DragonFly = "🐉"
Emscripten = "🔗"
EndeavourOS = ""
Fedora = ""
FreeBSD = ""
Garuda = ""
Gentoo = ""
HardenedBSD = "聯"
Illumos = "🐦"
Linux = ""
Macos = ""
Manjaro = ""
Mariner = ""
MidnightBSD = "🌘"
Mint = ""
NetBSD = ""
NixOS = ""
OpenBSD = ""
OpenCloudOS = "☁️"
openEuler = ""
openSUSE = ""
OracleLinux = "⊂⊃"
Pop = ""
Raspbian = ""
Redhat = ""
RedHatEnterprise = ""
Redox = "🧪"
Solus = ""
SUSE = ""
Ubuntu = ""
Unknown = ""
Windows = ""

# Username module
[username]
style_user = "bold fg:#ffc2ff bg:#302946"
style_root = "bold fg:#ff6677 bg:#302946"
format = '[ $user]($style)'
disabled = false
show_always = true

# Hostname configuration for SSH awareness
[hostname]
style = "bold fg:#ffb3ff bg:#302946"
ssh_only = true
format = '[@$hostname]($style)'
trim_at = "."
disabled = false

# Directory module
[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold fg:#ffc2ff bg:#514675"
format = "[ $path ]($style)"

# Git branch module
[git_branch]
symbol = " "
style = "bold fg:#ffc2ff bg:#6c5e9d"
format = "[ $symbol$branch ]($style)"

# Git status module
# ignore_submodules: scanning submodules made this module regularly blow
# past command_timeout and drop out of the prompt entirely
[git_status]
ignore_submodules = true
style = "bold fg:#ffc2ff bg:#6c5e9d"
format = "[$all_status]($style)"

# Python module
[python]
symbol = " "
style = "bold fg:#f8f8f2 bg:#9480d5"
format = '([ $symbol(${virtualenv}) ]($style))'
detect_extensions = ["py"]
detect_files = [
  "requirements.txt",
  "pyproject.toml",
  "Pipfile",
  "tox.ini",
  "setup.py",
]
disabled = false

# Kubernetes context — shouts when on prod
[kubernetes]
symbol = "󱃾 "
format = "[ $symbol$context ]($style)"
style = "bold fg:#f8f8f2 bg:#9480d5"
disabled = false
contexts = [
  { context_pattern = ".*[Pp][Rr][Oo][Dd].*", context_alias = "PROD", style = "bold fg:#1a1626 bg:#ffe699", symbol = " " },
  # EKS contexts — strip region (e.g., eks-us-west-2-int → eks-int)
  { context_pattern = "eks-[a-z]+-[a-z]+-\\d+-(?P<env>.*)", context_alias = "eks-$env", style = "bold fg:#f8f8f2 bg:#9480d5" },
  # Fallback
  { context_pattern = ".*", style = "bold fg:#f8f8f2 bg:#9480d5" }
]

# Time
[time]
disabled = true
format = '󱑍 [\[ $time \]]($style) '
time_format = "%T"

# Command duration
[cmd_duration]
min_time = 500
format = "took [$duration]($style) "
style = "bold fg:#ff6677"

# Battery
[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "
disabled = false

[[battery.display]]
threshold = 10
style = "bold red"

# Package version
[package]
symbol = "󰏗 "
style = "bold fg:#ff6677"
disabled = false

# Shell indicator
[shell]
fish_indicator = "󰈺 "
powershell_indicator = "󰨊 "
bash_indicator = "󱆃 "
zsh_indicator = "󱐋 "
unknown_indicator = "󰀣 "
style = "cyan bold"
disabled = true
