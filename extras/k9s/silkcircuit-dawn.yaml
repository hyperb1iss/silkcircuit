# SilkCircuit Dawn for k9s
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

# Place this file at $XDG_CONFIG_HOME/k9s/skins/silkcircuit-dawn.yaml, then set
# `k9s.ui.skin: silkcircuit-dawn` in config.yaml or export K9S_SKIN=silkcircuit-dawn.

k9s:
  # General K9s styles
  body:
    fgColor: "#2b2540"
    bgColor: "#faf8ff"
    logoColor: "#006e72"

  # ClusterInfoView styles
  info:
    fgColor: "#006e72"
    sectionColor: "#7e2bd5"

  # Frame styles
  frame:
    # Borders styles
    border:
      fgColor: "#006e72"
      focusColor: "#b40077"

    # MenuView attributes and styles
    menu:
      fgColor: "#2b2540"
      keyColor: "#b40077"
      # Used for favorite namespaces
      numKeyColor: "#b42a74"

    # CrumbView attributes for history navigation
    crumbs:
      fgColor: "#faf8ff"
      bgColor: "#7e2bd5"
      activeColor: "#006e72"

    # Resource status and update styles
    status:
      newColor: "#006e72"
      modifyColor: "#796100"
      addColor: "#006e72"
      errorColor: "#c1272d"
      highlightcolor: "#b40077"
      killColor: "#546189"
      completedColor: "#686177"

    # Border title styles
    title:
      fgColor: "#2b2540"
      bgColor: "#faf8ff"
      highlightColor: "#006e72"
      counterColor: "#b42a74"
      filterColor: "#796100"

  # Specific views styles
  views:
    # TableView attributes
    table:
      fgColor: "#2b2540"
      bgColor: "#faf8ff"
      cursorColor: "#f7f4ff"
      # Header row styles
      header:
        fgColor: "#7e2bd5"
        bgColor: "#f7f4ff"
        sorterColor: "#796100"

    # YAML info styles
    yaml:
      keyColor: "#7e2bd5"
      colonColor: "#686177"
      valueColor: "#006e72"

    # Logs styles
    logs:
      fgColor: "#2b2540"
      bgColor: "#f4f0ff"

    # Charts styles
    charts:
      bgColor: default
      defaultDialColors:
        - "#b40077"
        - "#006e72"
      defaultChartColors:
        - "#b40077"
        - "#006e72"
