# SilkCircuit Dawn for k9s
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

# Place this file at $XDG_CONFIG_HOME/k9s/skins/silkcircuit-dawn.yaml, then set
# `k9s.ui.skin: silkcircuit-dawn` in config.yaml or export K9S_SKIN=silkcircuit-dawn.

k9s:
  # General K9s styles
  body:
    fgColor: "#2b2540"
    bgColor: "#faf8ff"
    logoColor: "#007f8e"

  # ClusterInfoView styles
  info:
    fgColor: "#007f8e"
    sectionColor: "#7e2bd5"

  # Frame styles
  frame:
    # Borders styles
    border:
      fgColor: "#007f8e"
      focusColor: "#b40077"

    # MenuView attributes and styles
    menu:
      fgColor: "#2b2540"
      keyColor: "#b40077"
      # Used for favorite namespaces
      numKeyColor: "#c74a8c"

    # CrumbView attributes for history navigation
    crumbs:
      fgColor: "#faf8ff"
      bgColor: "#7e2bd5"
      activeColor: "#007f8e"

    # Resource status and update styles
    status:
      newColor: "#007f8e"
      modifyColor: "#a88600"
      addColor: "#007f8e"
      errorColor: "#c1272d"
      highlightcolor: "#b40077"
      killColor: "#8e84a8"
      completedColor: "#8e84a8"

    # Border title styles
    title:
      fgColor: "#2b2540"
      bgColor: "#faf8ff"
      highlightColor: "#007f8e"
      counterColor: "#c74a8c"
      filterColor: "#a88600"

  # Specific views styles
  views:
    # TableView attributes
    table:
      fgColor: "#2b2540"
      bgColor: "#faf8ff"
      cursorColor: "#e8e0ff"
      # Header row styles
      header:
        fgColor: "#7e2bd5"
        bgColor: "#e8e0ff"
        sorterColor: "#a88600"

    # YAML info styles
    yaml:
      keyColor: "#7e2bd5"
      colonColor: "#8e84a8"
      valueColor: "#007f8e"

    # Logs styles
    logs:
      fgColor: "#2b2540"
      bgColor: "#f1ecff"

    # Charts styles
    charts:
      bgColor: default
      defaultDialColors:
        - "#b40077"
        - "#007f8e"
      defaultChartColors:
        - "#b40077"
        - "#007f8e"
