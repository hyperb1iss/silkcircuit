# SilkCircuit Glow for tmux
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

# Status bar
set -g status on
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-style "bg=#000000,fg=#cc66ff"

# Left: the session name in an electric purple segment
set -g status-left "#[fg=#0a0816,bg=#ff00ff,bold] #S #[fg=#ff00ff,bg=#000000,nobold] "

# Right: host, clock, date. The separator is the one deliberately faint part.
set -g status-right "#[fg=#ff00ff]#h #[fg=#cc66ff]|#[fg=#ff00ff] %H:%M #[fg=#cc66ff]|#[fg=#cc66ff] %d %b "

# Window list
set -g window-status-separator ""
set -g window-status-style "bg=#000000,fg=#cc66ff"
set -g window-status-format "#[fg=#cc66ff,bg=#000000] #I:#W#F "
set -g window-status-current-format "#[fg=#ff00ff,bg=#000000]#[fg=#0a0816,bg=#ff00ff,bold] #I:#W#{?window_zoomed_flag,+,} #[fg=#ff00ff,bg=#000000,nobold]"
set -g window-status-activity-style "bg=#000000,fg=#ff00ff"
set -g window-status-bell-style "bg=#000000,fg=#ff0066,bold"
set -g window-status-last-style "bg=#000000,fg=#ffffff"

# Panes
set -g pane-border-style "fg=#cc66ff"
set -g pane-active-border-style "fg=#00ffff"
set -g display-panes-colour "#cc66ff"
set -g display-panes-active-colour "#ff00ff"

# Messages and the command prompt
set -g message-style "bg=#1a0033,fg=#ff00ff,bold"
set -g message-command-style "bg=#1a0033,fg=#ffffff"

# Copy mode. Search highlights are filled blocks, so they use accents that keep
# dark text legible on every variant.
set -g mode-style "bg=#4b0654,fg=#ffffff"
set -g copy-mode-match-style "bg=#ff00ff,fg=#0a0816"
set -g copy-mode-current-match-style "bg=#ff00ff,fg=#0a0816,bold"
set -g copy-mode-mark-style "bg=#00ffff,fg=#0a0816"

# Clock
set -g clock-mode-colour "#00ffff"

# Popups and menus
set -g popup-style "bg=#0a0816,fg=#ffffff"
set -g popup-border-style "fg=#00ffff"
set -g menu-style "bg=#1a0033,fg=#ffffff"
set -g menu-selected-style "bg=#ff00ff,fg=#0a0816,bold"
set -g menu-border-style "fg=#00ffff"
