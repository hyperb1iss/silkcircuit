# SilkCircuit Neon for tmux
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

# Status bar
set -g status on
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-style "bg=#0a0812,fg=#e9d5ff"

# Left: the session name in an electric purple segment
set -g status-left "#[fg=#12101a,bg=#e135ff,bold] #S #[fg=#e135ff,bg=#0a0812,nobold] "

# Right: host, clock, date
set -g status-right "#[fg=#80ffea]#h #[fg=#44475a]|#[fg=#f1fa8c] %H:%M #[fg=#44475a]|#[fg=#9580ff] %d %b "

# Window list
set -g window-status-separator ""
set -g window-status-style "bg=#0a0812,fg=#9580ff"
set -g window-status-format "#[fg=#9580ff,bg=#0a0812] #I:#W#F "
set -g window-status-current-format "#[fg=#ff00ff,bg=#0a0812]#[fg=#12101a,bg=#ff00ff,bold] #I:#W#{?window_zoomed_flag,+,} #[fg=#ff00ff,bg=#0a0812,nobold]"
set -g window-status-activity-style "bg=#0a0812,fg=#f1fa8c"
set -g window-status-bell-style "bg=#0a0812,fg=#ff6363,bold"
set -g window-status-last-style "bg=#0a0812,fg=#80ffea"

# Panes
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#5fffff"
set -g display-panes-colour "#44475a"
set -g display-panes-active-colour "#e135ff"

# Messages and the command prompt
set -g message-style "bg=#1a162a,fg=#ff00ff,bold"
set -g message-command-style "bg=#1a162a,fg=#80ffea"

# Copy mode
set -g mode-style "bg=#44475a,fg=#f8f8f2"
set -g copy-mode-match-style "bg=#f1fa8c,fg=#12101a"
set -g copy-mode-current-match-style "bg=#ff6ac1,fg=#12101a,bold"
set -g copy-mode-mark-style "bg=#80ffea,fg=#12101a"

# Clock
set -g clock-mode-colour "#80ffea"

# Popups and menus
set -g popup-style "bg=#12101a,fg=#f8f8f2"
set -g popup-border-style "fg=#5fffff"
set -g menu-style "bg=#1a162a,fg=#f8f8f2"
set -g menu-selected-style "bg=#e135ff,fg=#12101a,bold"
set -g menu-border-style "fg=#5fffff"
