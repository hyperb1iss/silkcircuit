# SilkCircuit Soft for tmux
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

# Status bar
set -g status on
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-style "bg=#141220,fg=#e9d5ff"

# Left: the session name in an electric purple segment
set -g status-left "#[fg=#1a1626,bg=#e892ff,bold] #S #[fg=#e892ff,bg=#141220,nobold] "

# Right: host, clock, date
set -g status-right "#[fg=#99ffee]#h #[fg=#44475a]|#[fg=#ffe699] %H:%M #[fg=#44475a]|#[fg=#b199ff] %d %b "

# Window list
set -g window-status-separator ""
set -g window-status-style "bg=#141220,fg=#b199ff"
set -g window-status-format "#[fg=#b199ff,bg=#141220] #I:#W#F "
set -g window-status-current-format "#[fg=#ff99ff,bg=#141220]#[fg=#1a1626,bg=#ff99ff,bold] #I:#W#{?window_zoomed_flag,+,} #[fg=#ff99ff,bg=#141220,nobold]"
set -g window-status-activity-style "bg=#141220,fg=#ffe699"
set -g window-status-bell-style "bg=#141220,fg=#ff6677,bold"
set -g window-status-last-style "bg=#141220,fg=#99ffee"

# Panes
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#88ffff"
set -g display-panes-colour "#44475a"
set -g display-panes-active-colour "#e892ff"

# Messages and the command prompt
set -g message-style "bg=#3e3456,fg=#ff99ff,bold"
set -g message-command-style "bg=#3e3456,fg=#99ffee"

# Copy mode
set -g mode-style "bg=#44475a,fg=#f8f8f2"
set -g copy-mode-match-style "bg=#ffe699,fg=#1a1626"
set -g copy-mode-current-match-style "bg=#ff99dd,fg=#1a1626,bold"
set -g copy-mode-mark-style "bg=#99ffee,fg=#1a1626"

# Clock
set -g clock-mode-colour "#99ffee"

# Popups and menus
set -g popup-style "bg=#1a1626,fg=#f8f8f2"
set -g popup-border-style "fg=#88ffff"
set -g menu-style "bg=#3e3456,fg=#f8f8f2"
set -g menu-selected-style "bg=#e892ff,fg=#1a1626,bold"
set -g menu-border-style "fg=#88ffff"
