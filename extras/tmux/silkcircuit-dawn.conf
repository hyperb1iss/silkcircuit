# SilkCircuit Dawn for tmux
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

# Status bar
set -g status on
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-style "bg=#f4f0ff,fg=#5a4d6e"

# Left: the session name in an electric purple segment
set -g status-left "#[fg=#faf8ff,bg=#7e2bd5,bold] #S #[fg=#7e2bd5,bg=#f4f0ff,nobold] "

# Right: host, clock, date. The separator is the one deliberately faint part.
set -g status-right "#[fg=#b40077]#h #[fg=#7353a9]|#[fg=#7e2bd5] %H:%M #[fg=#7353a9]|#[fg=#5a4d6e] %d %b "

# Window list
set -g window-status-separator ""
set -g window-status-style "bg=#f4f0ff,fg=#5a4d6e"
set -g window-status-format "#[fg=#5a4d6e,bg=#f4f0ff] #I:#W#F "
set -g window-status-current-format "#[fg=#b40077,bg=#f4f0ff]#[fg=#faf8ff,bg=#b40077,bold] #I:#W#{?window_zoomed_flag,+,} #[fg=#b40077,bg=#f4f0ff,nobold]"
set -g window-status-activity-style "bg=#f4f0ff,fg=#7e2bd5"
set -g window-status-bell-style "bg=#f4f0ff,fg=#c1272d,bold"
set -g window-status-last-style "bg=#f4f0ff,fg=#2b2540"

# Panes
set -g pane-border-style "fg=#7353a9"
set -g pane-active-border-style "fg=#006388"
set -g display-panes-colour "#5a4d6e"
set -g display-panes-active-colour "#7e2bd5"

# Messages and the command prompt
set -g message-style "bg=#f7f4ff,fg=#b40077,bold"
set -g message-command-style "bg=#f7f4ff,fg=#2b2540"

# Copy mode. Search highlights are filled blocks, so they use accents that keep
# dark text legible on every variant.
set -g mode-style "bg=#d4c8f0,fg=#2b2540"
set -g copy-mode-match-style "bg=#7e2bd5,fg=#faf8ff"
set -g copy-mode-current-match-style "bg=#b40077,fg=#faf8ff,bold"
set -g copy-mode-mark-style "bg=#006e72,fg=#faf8ff"

# Clock
set -g clock-mode-colour "#006e72"

# Popups and menus
set -g popup-style "bg=#faf8ff,fg=#2b2540"
set -g popup-border-style "fg=#006388"
set -g menu-style "bg=#f7f4ff,fg=#2b2540"
set -g menu-selected-style "bg=#7e2bd5,fg=#faf8ff,bold"
set -g menu-border-style "fg=#006388"
