# SilkCircuit Dawn for tmux
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

# Status bar
set -g status on
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-style "bg=#f1ecff,fg=#5a4d6e"

# Left: the session name in an electric purple segment
set -g status-left "#[fg=#faf8ff,bg=#7e2bd5,bold] #S #[fg=#7e2bd5,bg=#f1ecff,nobold] "

# Right: host, clock, date
set -g status-right "#[fg=#007f8e]#h #[fg=#d4c8f0]|#[fg=#a88600] %H:%M #[fg=#d4c8f0]|#[fg=#8e84a8] %d %b "

# Window list
set -g window-status-separator ""
set -g window-status-style "bg=#f1ecff,fg=#8e84a8"
set -g window-status-format "#[fg=#8e84a8,bg=#f1ecff] #I:#W#F "
set -g window-status-current-format "#[fg=#b40077,bg=#f1ecff]#[fg=#faf8ff,bg=#b40077,bold] #I:#W#{?window_zoomed_flag,+,} #[fg=#b40077,bg=#f1ecff,nobold]"
set -g window-status-activity-style "bg=#f1ecff,fg=#a88600"
set -g window-status-bell-style "bg=#f1ecff,fg=#c1272d,bold"
set -g window-status-last-style "bg=#f1ecff,fg=#007f8e"

# Panes
set -g pane-border-style "fg=#d4c8f0"
set -g pane-active-border-style "fg=#009fae"
set -g display-panes-colour "#d4c8f0"
set -g display-panes-active-colour "#7e2bd5"

# Messages and the command prompt
set -g message-style "bg=#e8e0ff,fg=#b40077,bold"
set -g message-command-style "bg=#e8e0ff,fg=#007f8e"

# Copy mode
set -g mode-style "bg=#d4c8f0,fg=#2b2540"
set -g copy-mode-match-style "bg=#a88600,fg=#faf8ff"
set -g copy-mode-current-match-style "bg=#c74a8c,fg=#faf8ff,bold"
set -g copy-mode-mark-style "bg=#007f8e,fg=#faf8ff"

# Clock
set -g clock-mode-colour "#007f8e"

# Popups and menus
set -g popup-style "bg=#faf8ff,fg=#2b2540"
set -g popup-border-style "fg=#009fae"
set -g menu-style "bg=#e8e0ff,fg=#2b2540"
set -g menu-selected-style "bg=#7e2bd5,fg=#faf8ff,bold"
set -g menu-border-style "fg=#009fae"
