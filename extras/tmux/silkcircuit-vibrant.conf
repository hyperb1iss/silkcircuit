# SilkCircuit Vibrant for tmux
# https://github.com/hyperb1iss/silkcircuit
#
# Generated by scripts/build from lua/silkcircuit/variants.lua.
# Do not edit by hand.

# Status bar
set -g status on
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-style "bg=#08060f,fg=#e9d5ff"

# Left: the session name in an electric purple segment
set -g status-left "#[fg=#0f0c1a,bg=#ff00ff,bold] #S #[fg=#ff00ff,bg=#08060f,nobold] "

# Right: host, clock, date
set -g status-right "#[fg=#00ffcc]#h #[fg=#3a2e5a]|#[fg=#ffcc00] %H:%M #[fg=#3a2e5a]|#[fg=#b366ff] %d %b "

# Window list
set -g window-status-separator ""
set -g window-status-style "bg=#08060f,fg=#b366ff"
set -g window-status-format "#[fg=#b366ff,bg=#08060f] #I:#W#F "
set -g window-status-current-format "#[fg=#ff00cc,bg=#08060f]#[fg=#0f0c1a,bg=#ff00cc,bold] #I:#W#{?window_zoomed_flag,+,} #[fg=#ff00cc,bg=#08060f,nobold]"
set -g window-status-activity-style "bg=#08060f,fg=#ffcc00"
set -g window-status-bell-style "bg=#08060f,fg=#ff3366,bold"
set -g window-status-last-style "bg=#08060f,fg=#00ffcc"

# Panes
set -g pane-border-style "fg=#3a2e5a"
set -g pane-active-border-style "fg=#00ffff"
set -g display-panes-colour "#3a2e5a"
set -g display-panes-active-colour "#ff00ff"

# Messages and the command prompt
set -g message-style "bg=#0a0614,fg=#ff00cc,bold"
set -g message-command-style "bg=#0a0614,fg=#00ffcc"

# Copy mode
set -g mode-style "bg=#3a2e5a,fg=#f8f8f2"
set -g copy-mode-match-style "bg=#ffcc00,fg=#0f0c1a"
set -g copy-mode-current-match-style "bg=#f78c6c,fg=#0f0c1a,bold"
set -g copy-mode-mark-style "bg=#00ffcc,fg=#0f0c1a"

# Clock
set -g clock-mode-colour "#00ffcc"

# Popups and menus
set -g popup-style "bg=#0f0c1a,fg=#f8f8f2"
set -g popup-border-style "fg=#00ffff"
set -g menu-style "bg=#0a0614,fg=#f8f8f2"
set -g menu-selected-style "bg=#ff00ff,fg=#0f0c1a,bold"
set -g menu-border-style "fg=#00ffff"
